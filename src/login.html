<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="zakaria najjar">
  <meta name="description" content="موقع لحجز الرحلات السياحية المناسبة">
  <link rel="icon" type="image/png" href="./images/safferni-icon-bg-gray.jpg">
  <title>سفرني | تسجيل الدخول</title>
</head>

<body class="pageLogin" data-bs-spy="scroll" data-bs-target="#navbar">
  <header>
    <div class="head-up">
      <nav class="navbar navbar-expand-lg fixed-top" id="navbar">
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html"><img src="./images/safferni-icon.svg" alt="safferni" loading="lazy">
            سفرني</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#safferniNavbar"
            aria-controls="safferniNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse " id="safferniNavbar">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="./index.html?#head-foot">الرئيسية</a>
              </li>
              <li class="nav-item">
                <a class="nav-link " aria-current="page" href="./index.html?#services">خدماتنا</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./index.html?#tours">جولاتنا السياحية</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./index.html?#contact-us">تواصل معنا</a>
              </li>
            </ul>
            <div class="login">
              <a href="./register.html">
                <button type="button" class="btn btn-outline-secondary">تسجيل الدخول</button>
              </a>
            </div>
          </div>
        </div>
      </nav>
    </div>
  </header>
  <div class="sign-in d-flex justify-content-center align-items-center" style="height: 100vh;">
    <form id="login" dir="rtl">
      <div class="mb-3">
        <label for="InputEmail1" class="form-label">البريد الإلكتروني :</label>
        <input type="email" class="form-control" id="InputEmail1" aria-describedby="InputEmail1" required>
      </div>
      <div class="mb-3">
        <label for="InputPassword1" class="form-label">كلمة المرور :</label>
        <input type="password" class="form-control" id="InputPassword1" required>
      </div>
      <div class="submit mt-4">
        <button type="submit" class="btn btn-basic">تسجيل الدخول</button>
        <a class="forget" href="#">هل نسيت كلمة المرور؟</a>
      </div>

    </form>
  </div>
</body>

</html>
